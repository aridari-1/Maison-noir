<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maison Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080706;
    --bg-vignette: radial-gradient(ellipse at 50% 38%, #171310 0%, #0a0908 55%, #050403 100%);
    --lacquer-1:#1b160f;
    --lacquer-2:#0c0a07;
    --lacquer-edge:#2a2117;
    --gold:#c9a961;
    --gold-bright:#f0dfae;
    --gold-deep:#7d6132;
    --paper:#111011;
    --paper-hi:#242220;
    --cream:#ece2ce;
    --cream-shade:#c9bb9e;
    --ember:#ff7a2e;
    --ember-core:#ffe1a8;
    --text:#efe8da;
    --text-dim:#9a9182;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    background:var(--bg-vignette);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter',sans-serif;
    color:var(--text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 20px 40px;
  }
  .brand{
    font-family:'Cormorant Garamond',serif;
    font-weight:400;
    letter-spacing:0.42em;
    font-size:15px;
    color:var(--gold);
    text-indent:0.42em;
    margin-bottom:6px;
    opacity:0.92;
  }
  .brand-rule{
    width:36px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold-deep),transparent);
    margin-bottom:44px;
    opacity:0.7;
  }
  .stage{
    position:relative;
    width:100%;
    height:420px;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1400px;
  }
  #smoke-canvas{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:5;
  }

  /* ===== CASE ===== */
  .case{
    position:relative;
    width:300px;
    height:126px;
    transform-style:preserve-3d;
    cursor:pointer;
    transition:opacity 0.8s ease, transform 0.8s ease;
  }
  .case.hidden-case{
    opacity:0;
    transform:translateY(30px) scale(0.92);
    pointer-events:none;
  }
  .case-base{
    position:absolute;
    inset:0;
    border-radius:6px;
    background:
      linear-gradient(155deg, var(--lacquer-1) 0%, var(--lacquer-2) 55%, #060504 100%);
    border:1px solid var(--lacquer-edge);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.75),
      0 2px 0 rgba(255,255,255,0.02) inset,
      0 0 0 1px rgba(0,0,0,0.4);
    overflow:hidden;
  }
  .case-base::before{
    content:'';
    position:absolute;
    left:10px;right:10px;top:10px;bottom:10px;
    border:1px solid rgba(201,169,97,0.28);
    border-radius:3px;
    pointer-events:none;
  }
  .case-interior{
    position:absolute;
    inset:16px;
    border-radius:2px;
    background:linear-gradient(180deg, #050403, #0a0806);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:8px;
    padding-bottom:10px;
    box-shadow:inset 0 8px 18px rgba(0,0,0,0.6);
  }
  .case-lid{
    position:absolute;
    inset:0;
    border-radius:6px;
    background:
      linear-gradient(155deg, #241d13 0%, var(--lacquer-1) 45%, #0c0a07 100%);
    border:1px solid var(--lacquer-edge);
    transform-origin:top center;
    transform:rotateX(0deg);
    transition:transform 1.1s cubic-bezier(.22,1,.36,1);
    box-shadow:
      0 2px 0 rgba(255,255,255,0.03) inset,
      0 18px 40px -12px rgba(0,0,0,0.7);
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .case.open .case-lid{
    transform:rotateX(-122deg) translateY(-1px);
  }
  .lid-emblem{
    font-family:'Cormorant Garamond',serif;
    font-size:26px;
    letter-spacing:0.14em;
    color:var(--gold);
    opacity:0.85;
    text-indent:0.14em;
  }
  .lid-clasp{
    position:absolute;
    bottom:-7px;left:50%;
    transform:translateX(-50%);
    width:34px;height:14px;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold-deep));
    border-radius:2px;
    box-shadow:0 3px 6px rgba(0,0,0,0.5);
    z-index:3;
  }

  /* ===== CIGARETTES IN ROW ===== */
  .row{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:6px;
    opacity:0;
    transition:opacity 0.5s ease 0.55s;
  }
  .case.open .row{ opacity:1; }

  .cig{
    position:relative;
    width:15px;
    height:78px;
    border-radius:2px 2px 1px 1px;
    background:linear-gradient(90deg,#0c0b0a 0%, var(--paper-hi) 35%, #0c0b0a 100%);
    box-shadow:0 3px 6px rgba(0,0,0,0.5);
    cursor:pointer;
    transform:translateY(6px);
    opacity:0;
    animation:rise 0.5s cubic-bezier(.22,1,.36,1) forwards;
    transition:transform 0.25s ease;
  }
  .case.open .cig{ animation-play-state:running; }
  .cig:nth-child(1){animation-delay:0.62s}
  .cig:nth-child(2){animation-delay:0.68s}
  .cig:nth-child(3){animation-delay:0.74s}
  .cig:nth-child(4){animation-delay:0.80s}
  .cig:nth-child(5){animation-delay:0.86s}
  .cig:nth-child(6){animation-delay:0.92s}
  .cig:nth-child(7){animation-delay:0.98s}
  @keyframes rise{
    to{opacity:1; transform:translateY(0);}
  }
  .cig:hover{ transform:translateY(-6px); }
  .cig .band{
    position:absolute;
    left:0;right:0;top:16px;
    height:6px;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold-deep));
  }
  .cig .filter{
    position:absolute;
    left:0;right:0;bottom:0;top:22px;
    background:linear-gradient(90deg,#d8c9a8,var(--cream) 40%,#c9bb9e 100%);
    border-radius:0 0 1px 1px;
  }
  .cig.taken{ opacity:0; pointer-events:none; transition:opacity 0.3s ease; }
  .case.selecting .cig{ pointer-events:none; }

  /* ===== STANDALONE (selected) CIGARETTE ===== */
  .cig-standalone{
    position:absolute;
    width:20px;
    height:190px;
    border-radius:3px 3px 2px 2px;
    background:linear-gradient(90deg,#0c0b0a 0%, var(--paper-hi) 38%, #0c0b0a 100%);
    box-shadow:0 20px 40px -14px rgba(0,0,0,0.7);
    z-index:4;
  }
  .cig-standalone .band{
    position:absolute;
    left:0;right:0;
    top:38px;
    height:9px;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold-deep));
  }
  .cig-standalone .filter{
    position:absolute;
    left:0;right:0;bottom:0;top:47px;
    background:linear-gradient(90deg,#d8c9a8,var(--cream) 40%,#c9bb9e 100%);
    border-radius:0 0 2px 2px;
  }
  .cig-standalone .tip{
    position:absolute;
    left:0;right:0;top:-1px;
    height:6px;
    background:#3a3735;
    border-radius:2px 2px 0 0;
    transition:background 0.4s ease, box-shadow 0.4s ease;
  }
  .cig-standalone .tip.lit{
    background:linear-gradient(180deg,var(--ember-core), var(--ember) 55%, #7a2c0c);
    box-shadow:
      0 0 14px 4px rgba(255,130,50,0.55),
      0 0 34px 14px rgba(255,120,40,0.22);
    animation:emberflicker 1.6s ease-in-out infinite;
  }
  @keyframes emberflicker{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.18); }
  }
  .cig-standalone.puffing .tip.lit{
    filter:brightness(1.5);
    box-shadow:
      0 0 20px 7px rgba(255,150,70,0.75),
      0 0 46px 20px rgba(255,120,40,0.32);
  }

  /* ===== LIGHTER ===== */
  .lighter-btn{
    position:absolute;
    bottom:6px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    width:52px;height:52px;
    border-radius:50%;
    border:1px solid rgba(201,169,97,0.4);
    background:radial-gradient(circle at 35% 30%, #201a12, #0a0806 75%);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
    z-index:6;
  }
  .lighter-btn.show{
    opacity:1; pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  .lighter-btn.spent{ opacity:0.35; pointer-events:none; cursor:default; }
  .lighter-btn svg{ width:22px;height:22px; }
  .flame{
    position:absolute;
    left:50%;
    bottom:56px;
    transform:translateX(-50%) scale(0.3);
    width:16px;height:24px;
    opacity:0;
    pointer-events:none;
    z-index:6;
  }
  .flame.active{
    animation:flameburst 0.6s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes flameburst{
    0%{ opacity:0; transform:translateX(-50%) scale(0.2) translateY(6px); }
    35%{ opacity:1; transform:translateX(-50%) scale(1.15) translateY(-2px); }
    70%{ opacity:1; transform:translateX(-50%) scale(0.9) translateY(0px); }
    100%{ opacity:0; transform:translateX(-50%) scale(0.5) translateY(-4px); }
  }
  .flame::before{
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 70%, var(--ember-core) 0%, var(--ember) 55%, transparent 75%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    filter:blur(0.3px);
  }

  /* ===== INSTRUCTIONS ===== */
  .instructions{
    margin-top:28px;
    font-size:13px;
    letter-spacing:0.06em;
    color:var(--text-dim);
    text-align:center;
    min-height:18px;
    transition:opacity 0.3s ease;
  }
  .reset{
    margin-top:18px;
    background:none;
    border:1px solid rgba(201,169,97,0.28);
    color:var(--gold);
    font-family:'Inter',sans-serif;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:2px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .reset.show{ opacity:0.75; pointer-events:auto; }
  .reset:hover{ opacity:1; background:rgba(201,169,97,0.08); border-color:rgba(201,169,97,0.5); }

  @media (max-width:420px){
    .stage{ height:380px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">Maison&nbsp;Noir</div>
  <div class="brand-rule"></div>

  <div class="stage" id="stage">
    <canvas id="smoke-canvas"></canvas>

    <div class="case" id="case">
      <div class="case-base">
        <div class="case-interior">
          <div class="row" id="row"></div>
        </div>
      </div>
      <div class="case-lid" id="lid">
        <div class="lid-emblem">M·N</div>
        <div class="lid-clasp"></div>
      </div>
    </div>

    <div class="cig-standalone" id="cigStandalone" style="display:none;">
      <div class="tip" id="tip"></div>
      <div class="band"></div>
      <div class="filter"></div>
    </div>

    <div class="flame" id="flame"></div>

    <button class="lighter-btn" id="lighterBtn" aria-label="Light the cigarette">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M9 3c0 3-3 4-3 8a6 6 0 0 0 12 0c0-2-1-3-2-4 0 2-1 3-2 2 1-3-1-5-3-7-1 1 0 3-2 1z"
          fill="none" stroke="#c9a961" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="instructions" id="instructions">Tap the case to open it</div>
  <button class="reset" id="resetBtn">Start over</button>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const caseEl = document.getElementById('case');
  const row = document.getElementById('row');
  const lid = document.getElementById('lid');
  const cigStandalone = document.getElementById('cigStandalone');
  const tip = document.getElementById('tip');
  const lighterBtn = document.getElementById('lighterBtn');
  const flame = document.getElementById('flame');
  const instructions = document.getElementById('instructions');
  const resetBtn = document.getElementById('resetBtn');
  const canvas = document.getElementById('smoke-canvas');
  const ctx = canvas.getContext('2d');

  let stageStage = 'closed'; // closed -> open -> selected -> lit
  let lit = false;
  let puffing = false;
  let smokeTimer = 0;
  let particles = [];
  let animId = null;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas(){
    const r = stage.getBoundingClientRect();
    canvas.width = r.width * dpr;
    canvas.height = r.height * dpr;
    canvas.style.width = r.width + 'px';
    canvas.style.height = r.height + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resizeCanvas);

  // build 7 cigarettes in the case
  for(let i=0;i<7;i++){
    const c = document.createElement('div');
    c.className = 'cig';
    c.innerHTML = '<div class="band"></div><div class="filter"></div>';
    c.addEventListener('click', () => selectCig(c));
    row.appendChild(c);
  }

  function setInstruction(text){
    instructions.style.opacity = 0;
    setTimeout(()=>{ instructions.textContent = text; instructions.style.opacity = 1; }, 180);
  }

  caseEl.addEventListener('click', (e)=>{
    if(stageStage !== 'closed') return;
    openCase();
  });

  function openCase(){
    stageStage = 'open';
    caseEl.classList.add('open');
    setInstruction('Choose one');
  }

  function selectCig(cigEl){
    if(stageStage !== 'open') return;
    stageStage = 'selecting';
    caseEl.classList.add('selecting');

    // fade out siblings
    Array.from(row.children).forEach(c=>{
      if(c!==cigEl) c.classList.add('taken');
    });

    const startRect = cigEl.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();

    cigStandalone.style.display = 'block';
    cigStandalone.style.left = (startRect.left - stageRect.left) + 'px';
    cigStandalone.style.top = (startRect.top - stageRect.top) + 'px';
    cigStandalone.style.width = startRect.width + 'px';
    cigStandalone.style.height = startRect.height + 'px';
    cigStandalone.style.transition = 'none';
    cigStandalone.style.opacity = '1';

    cigEl.style.opacity = '0';

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        cigStandalone.style.transition = 'left 1s cubic-bezier(.22,1,.36,1), top 1s cubic-bezier(.22,1,.36,1), width 1s cubic-bezier(.22,1,.36,1), height 1s cubic-bezier(.22,1,.36,1)';
        const targetW = 20, targetH = 190;
        cigStandalone.style.left = (stageRect.width/2 - targetW/2) + 'px';
        cigStandalone.style.top = (stageRect.height/2 - targetH/2 - 20) + 'px';
        cigStandalone.style.width = targetW + 'px';
        cigStandalone.style.height = targetH + 'px';
      });
    });

    caseEl.classList.add('hidden-case');
    setInstruction('Light it');

    setTimeout(()=>{
      stageStage = 'selected';
      lighterBtn.classList.add('show');
    }, 950);
  }

  lighterBtn.addEventListener('click', ()=>{
    if(stageStage !== 'selected') return;
    stageStage = 'lighting';
    lighterBtn.classList.add('spent');

    flame.style.left = cigStandalone.style.left;
    flame.style.transform = 'translateX(0)';
    const cigRect = cigStandalone.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    flame.style.left = (cigRect.left - stageRect.left + cigRect.width/2 - 8) + 'px';
    flame.style.top = (cigRect.top - stageRect.top - 20) + 'px';
    flame.style.bottom = 'auto';
    flame.classList.add('active');

    setTimeout(()=>{
      tip.classList.add('lit');
      lit = true;
      stageStage = 'lit';
      setInstruction('Hold to draw');
      resetBtn.classList.add('show');
      startSmoke();
    }, 420);
  });

  cigStandalone.addEventListener('pointerdown', ()=>{
    if(!lit) return;
    puffing = true;
    cigStandalone.classList.add('puffing');
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
    cigStandalone.addEventListener(ev, ()=>{
      puffing = false;
      cigStandalone.classList.remove('puffing');
    });
  });

  resetBtn.addEventListener('click', ()=>{
    window.location.reload();
  });

  function getTipPos(){
    const cigRect = cigStandalone.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    return {
      x: cigRect.left - stageRect.left + cigRect.width/2,
      y: cigRect.top - stageRect.top + 2
    };
  }

  function spawnParticle(){
    const p = getTipPos();
    const spread = puffing ? 3 : 1.4;
    particles.push({
      x: p.x + (Math.random()-0.5)*spread,
      y: p.y,
      vx: (Math.random()-0.5)*0.18,
      vy: -(0.35 + Math.random()*0.25) * (puffing ? 1.6 : 1),
      r: (puffing ? 2.2 : 1.6) + Math.random()*1.4,
      life: 0,
      maxLife: puffing ? 220 : 320,
      wobble: Math.random()*Math.PI*2,
      wobbleSpeed: 0.01 + Math.random()*0.015,
      alpha: puffing ? 0.5 : 0.32
    });
  }

  function startSmoke(){
    if(animId) return;
    resizeCanvas();
    animId = requestAnimationFrame(loop);
  }

  function loop(){
    smokeTimer++;
    const rate = puffing ? 2 : 7;
    if(smokeTimer % rate === 0 && lit){
      spawnParticle();
      if(puffing) spawnParticle();
    }

    const r = stage.getBoundingClientRect();
    ctx.clearRect(0,0,r.width,r.height);

    particles.forEach(p=>{
      p.life++;
      p.wobble += p.wobbleSpeed;
      p.x += p.vx + Math.sin(p.wobble)*0.25;
      p.y += p.vy;
      p.vy *= 0.995;
      p.r += 0.055;

      const t = p.life / p.maxLife;
      const a = p.alpha * (1 - t) * (t < 0.08 ? t/0.08 : 1);

      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*2.2);
      grad.addColorStop(0, `rgba(226,220,208,${a})`);
      grad.addColorStop(1, 'rgba(226,220,208,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r*2.2, 0, Math.PI*2);
      ctx.fill();
    });

    particles = particles.filter(p => p.life < p.maxLife);
    animId = requestAnimationFrame(loop);
  }

  resizeCanvas();
})();
</script>
</body>
</html>
